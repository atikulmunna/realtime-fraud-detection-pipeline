global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: feedback_api
    metrics_path: /metrics
    static_configs:
      - targets: ["feedback-api:8000"]

  - job_name: online_consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["online-updater:8002"]

  - job_name: outbox_relay
    metrics_path: /metrics
    static_configs:
      - targets: ["outbox-relay:8003"]
