apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: config-patch.yaml
  - path: flink-image-patch.yaml
images:
  - name: ghcr.io/example/realtime-fraud-app
    newName: realtime-fraud/app
    newTag: local
secretGenerator:
  - name: fraud-secrets
    envs: [secret.env.example]
generatorOptions:
  disableNameSuffixHash: true
