apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedback-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: feedback-api}
  template:
    metadata:
      labels: {app: feedback-api}
    spec:
      serviceAccountName: fraud-app
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/example/realtime-fraud-app:latest
          args: ["uvicorn", "src.api.app_entry:app_factory", "--factory", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: fraud-config}
            - secretRef: {name: fraud-secrets}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: feedback-api
spec:
  selector: {app: feedback-api}
  ports: [{name: http, port: 8000, targetPort: http}]
