[project]
name = "realtime-fraud-detection-pipeline"
version = "0.1.0"
description = "Real-time fraud detection with offline training, streaming inference, online feedback, and observability."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "confluent-kafka>=2.8,<3.0",
  "httpx>=0.27,<1.0",
  "kagglehub>=0.3,<1.0",
  "kafka-python>=2.0,<3.0",
  "mlflow>=2.16,<3.0",
  "jsonschema>=4.23,<5.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "pyarrow>=17.0,<20.0",
  "pydantic>=2.8,<3.0",
  "prometheus-client>=0.21,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "scikit-learn>=1.5,<2.0",
  "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2.0",
  "pre-commit>=4.0,<5.0",
  "pytest>=8.2,<9.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.11,<1.0",
  "types-requests>=2.32,<3.0",
]

[tool.uv]
package = false
cache-dir = ".uv-cache"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data", "logs", "models", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "-q",
  "--strict-markers",
  "--basetemp=.pytest-tmp",
  "--cov=src",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=85",
]
markers = [
  "integration: tests that require local infrastructure",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
  'def main\(\) -> None:',
  '\.\.\.',
  "if TYPE_CHECKING:",
]
